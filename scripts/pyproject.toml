[project]
name = "wiki-scripts"
version = "0.1.0"
description = "Build, lint, and maintain the ~/wiki SQLite query index"
requires-python = ">=3.9"
dependencies = [
    "python-frontmatter>=1.1.0",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["build_db", "lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
