# Raven — Docker Compose (4 진입점 일괄, one command).
# v0.7.16+: 'version' 키 제거 (Docker Compose v2 deprecated).
#
# 사용법:
#   docker compose up --build    # build + start 3 services
#   docker compose down           # stop + remove containers
#   docker compose logs -f api   # 로그 follow
#
# 외부 접속 (.env에서 HOST=0.0.0.0 권장):
#   http://<host>:8765      # API
#   http://<host>:8766/mcp  # MCP HTTP
#   http://<host>:5173      # Dashboard
#
# MCP stdio는 docker exec -it raven-api / docker-entrypoint.sh mcp-stdio

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: raven:latest
    container_name: raven-api
    command: ["api"]
    env_file:
      - .env
    # v0.7.18+: WIKI_VAULTS_DIR 환경변수 명시 (registry.py가 읽는 이름)
    environment:
      - WIKI_VAULTS_DIR=/vaults
    ports:
      - "${PORT_API}:8765"
    volumes:
      # ──────────────────────────────────────────────────────────────
      # v0.7.14+: vault 영속성 보장 (bind mount, 컨테이너 down/up 안전)
      # ──────────────────────────────────────────────────────────────
      # 1) 사용자 vault 외부 경로 ~/Raven → 컨테이너 /vaults
      #    → content/ + .vault.json + wiki.db + .mcp/ + backups/ + logs/
      #    → 마운트된 호스트 디렉토리에 영속. 컨테이너 재시작해도 보존.
      # 2) 다른 PC에서도 호스트의 동일 경로를 mount하면 동일하게 동작.
      - ${RAVEN_VAULTS_DIR}:/vaults
    working_dir: /vaults
    networks:
      - raven-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/vaults"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-http:
    build:
      context: .
      dockerfile: Dockerfile
    image: raven:latest
    container_name: raven-mcp-http
    command: ["mcp-http"]
    env_file:
      - .env
    # v0.7.18+: WIKI_VAULTS_DIR 명시
    environment:
      - WIKI_VAULTS_DIR=/vaults
    ports:
      - "${PORT_MCP_HTTP}:8766"
    volumes:
      # v0.7.14+: vault 영속성 (api 서비스와 동일 mount)
      - ${RAVEN_VAULTS_DIR}:/vaults
    working_dir: /vaults
    networks:
      - raven-net
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: raven:latest
    container_name: raven-dashboard
    command: ["dashboard"]
    env_file:
      - .env
    ports:
      - "${PORT_DASHBOARD}:5173"
    networks:
      - raven-net
    depends_on:
      - api
      - mcp-http
    restart: unless-stopped

networks:
  raven-net:
    driver: bridge
