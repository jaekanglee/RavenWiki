<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Raven</title>
  <desc id="desc">A cute front-facing raven inside a mint halo</desc>

  <!-- Full-bleed base keeps store icons opaque; the inset tile preserves the rounded app shape. -->
  <rect width="512" height="512" fill="#0A1018"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0F1620"/>
  <circle cx="256" cy="252" r="184" fill="#9DD9B5"/>
  <circle cx="256" cy="252" r="160" fill="#C7EBD3"/>

  <!-- Tucked body and symmetrical wings -->
  <ellipse cx="256" cy="352" rx="128" ry="108" fill="#111A25"/>
  <path d="M157 305C119 329 110 382 138 418C154 438 178 449 204 451C179 423 170 390 180 358C188 334 198 319 214 307C192 296 174 295 157 305Z" fill="#1C2A39"/>
  <path d="M355 305C393 329 402 382 374 418C358 438 334 449 308 451C333 423 342 390 332 358C324 334 314 319 298 307C320 296 338 295 355 305Z" fill="#1C2A39"/>
  <path d="M150 387C164 399 178 407 194 411" fill="none" stroke="#9DD9B5" stroke-width="12" stroke-linecap="round"/>
  <path d="M362 387C348 399 334 407 318 411" fill="none" stroke="#9DD9B5" stroke-width="12" stroke-linecap="round"/>

  <!-- Round head with three soft crown feathers -->
  <path d="M151 242C151 181 185 132 231 116C231 96 241 76 256 60C271 76 281 96 281 116C327 132 361 181 361 242C361 319 316 360 256 360C196 360 151 319 151 242Z" fill="#111A25"/>
  <path d="M211 125C208 102 216 82 234 66C240 87 240 104 232 120Z" fill="#1C2A39"/>
  <path d="M301 125C304 102 296 82 278 66C272 87 272 104 280 120Z" fill="#1C2A39"/>

  <!-- Friendly, forward-looking face -->
  <ellipse cx="210" cy="227" rx="38" ry="44" fill="#F7FBF8"/>
  <ellipse cx="302" cy="227" rx="38" ry="44" fill="#F7FBF8"/>
  <circle cx="216" cy="235" r="18" fill="#0F1620"/>
  <circle cx="296" cy="235" r="18" fill="#0F1620"/>
  <circle cx="222" cy="229" r="6" fill="#9DD9B5"/>
  <circle cx="290" cy="229" r="6" fill="#9DD9B5"/>

  <!-- Short, centered beak -->
  <path d="M212 277C226 260 242 252 256 252C270 252 286 260 300 277C284 292 269 299 256 299C243 299 228 292 212 277Z" fill="#F2C66D"/>
  <path d="M222 279H290C278 292 267 299 256 299C245 299 234 292 222 279Z" fill="#D99C45"/>

  <!-- Tiny cheek marks keep the expression warm at medium sizes -->
