<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- outer dark rounded square background (Raven dark identity) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F1620"/>

  <!-- mint green ring (outer + inner layered) -->
  <circle cx="32" cy="32" r="22" fill="#9DD9B5"/>
  <circle cx="32" cy="32" r="18" fill="#C7EBD3"/>

  <!-- raven body (pure black) -->
  <ellipse cx="32" cy="38" rx="11" ry="13" fill="#0F1620"/>

  <!-- raven head — angular, beak-forward crow shape (no round penguin collar) -->
  <path
    d="M20 24 L23 16 L28 13 L30 16 L34 16 L36 13 L41 16 L44 24 Z"
    fill="#0F1620"
  />

  <!-- beak (black, sharp triangular crow beak) -->
  <path d="M30 22 L34 22 L33 26 Z" fill="#0F1620"/>

  <!-- left wing (folded, sharp angular — crow-like) -->
  <path d="M21 30 L23 46 L26 42 L25 32 Z" fill="#0F1620"/>
  <!-- right wing -->
  <path d="M43 30 L41 46 L38 42 L39 32 Z" fill="#0F1620"/>

  <!-- left eye (white circle + dark pupil + highlight) -->
  <circle cx="28" cy="20" r="2.2" fill="#FFFFFF"/>
  <circle cx="28" cy="20" r="1.2" fill="#0F1620"/>
  <circle cx="28.5" cy="19.5" r="0.4" fill="#FFFFFF"/>

  <!-- right eye -->
  <circle cx="36" cy="20" r="2.2" fill="#FFFFFF"/>
  <circle cx="36" cy="20" r="1.2" fill="#0F1620"/>
  <circle cx="36.5" cy="19.5" r="0.4" fill="#FFFFFF"/>

  <!-- tail feathers (angular, crow-like) -->
  <path d="M28 50 L30 54 L32 51 L34 54 L36 50 L33 49 L31 49 Z" fill="#0F1620"/>

  <!-- left foot (orange) -->
  <ellipse cx="29" cy="51" rx="2.4" ry="1.4" fill="#FF9A2E"/>
  <!-- right foot -->
  <ellipse cx="35" cy="51" rx="2.4" ry="1.4" fill="#FF9A2E"/>
</svg>