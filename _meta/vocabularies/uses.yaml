name: uses
inverse: null
allowed:
  - source_type: concept
    target_type: concept
  - source_type: implementation
    target_type: implementation
  - source_type: tool
    target_type: tool
description: >
  한 요소가 다른 요소를 활용하여 구성됨을 나타냅니다.
  예를 들어, Authentication 서비스가 내부적으로 JWT 토큰을 사용하는 경우 'Authentication uses JWT'로 연결할 수 있습니다.
