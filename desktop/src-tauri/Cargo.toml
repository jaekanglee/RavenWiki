[package]
name = "raven-desktop"
version = "0.1.0"
description = "Raven desktop runtime spike"
authors = ["Raven"]
edition = "2021"

[lib]
name = "raven_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
